packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - sharp
  - unrs-resolver
  - "@prisma/client"
  - prisma

overrides:
  ioredis: "5.4.2"
  pluggy-connect-sdk: "2.12.0"

patchedDependencies:
  '@expo/metro-runtime@4.0.1': patches/@expo__metro-runtime@4.0.1.patch

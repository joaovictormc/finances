packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - sharp
  - unrs-resolver
  - "@prisma/client"
  - prisma

overrides:
  ioredis: "5.4.2"
  pluggy-connect-sdk: "2.12.0"
  "form-data@<2.5.6": "2.5.6"
  "next@>=16.0.0 <16.2.11": "16.2.11"

services:
  api-staging:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env.staging
    ports:
      - "3011:3001"
    restart: unless-stopped

  web-staging:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env.staging
    ports:
      - "3010:3000"
    restart: unless-stopped

services:
  db-init-staging:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env.staging
    command: ["pnpm", "--filter", "@finances/db", "db:seed"]
    restart: "no"

  api-staging:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env.staging
    depends_on:
      db-init-staging:
        condition: service_completed_successfully
    ports:
      - "3011:3001"
    restart: unless-stopped

  web-staging:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env.staging
    environment:
      API_INTERNAL_URL: http://api-staging:3001
    depends_on:
      - api-staging
    ports:
      - "3010:3000"
    restart: unless-stopped
